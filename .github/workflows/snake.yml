name: Update pastel yellow contribution snake

on:
  schedule:
    - cron: "17 16 * * *" # 12:17 AM Philippine time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#C9A227&color_dots=#FFFBE6,#FFF0A8,#F9DE6E,#E8C34A,#C9A227
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFF3B8&color_dots=#161B22,#3D3618,#6B5D24,#B39A3E,#FBE7A1

      - name: Publish snake images
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
